server {
    # Browser -> nginx is HTTPS. Certificates are mounted from ./certs (see docker-compose.yml).
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # redirect plain http:// on this port to https://
    error_page 497 =301 https://$http_host$request_uri;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # only uploads may be large; keep this above max_upload_bytes in config.yaml
    location = /api/files/upload {
        client_max_body_size 201m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_pass https://api-gateway:8443/api/files/upload;
        proxy_http_version 1.1;

        proxy_ssl_verify              on;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
        proxy_ssl_name                api-gateway;
        proxy_ssl_server_name         on;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~ ^/api/files/[^/]+/version$ {
        client_max_body_size 201m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        proxy_pass https://api-gateway:8443;
        proxy_http_version 1.1;

        proxy_ssl_verify              on;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
        proxy_ssl_name                api-gateway;
        proxy_ssl_server_name         on;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass https://api-gateway:8443/api/;
        proxy_http_version 1.1;

        proxy_ssl_verify              on;
        proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
        proxy_ssl_name                api-gateway;
        proxy_ssl_server_name         on;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
