// IDL contract for the Storage service (folders and files).
//
// Every rpc is bound to a URI + HTTP method via google.api.http so the
// api-gateway can expose it as REST/JSON over HTTPS.
//
// All rpcs require a valid session JWT. The client sends it as
// "Authorization: Bearer <jwt>"; grpc-gateway forwards it as gRPC metadata
// "authorization", and storage-service checks it in a unary interceptor.
//
// After editing this file run `bash proto/generate.sh`.
// NEVER edit the generated *.pb.go / *_grpc.pb.go / *.pb.gw.go files.
syntax = "proto3";

package storage;

option go_package = "stashr/proto/storage;storagepb";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service StorageService {
  // POST /api/folders  -> 201 Created (signalled via x-http-code metadata)
  rpc CreateFolder(CreateFolderRequest) returns (FolderResponse) {
    option (google.api.http) = {
      post: "/api/folders"
      body: "*"
    };
  }

  // GET /api/folders/{folder_id}  - contents of one folder
  // GET /api/folders              - root ("My Drive"), or legacy ?parentId=<id>
  rpc BrowseFolder(BrowseFolderRequest) returns (FolderContentResponse) {
    option (google.api.http) = {
      get: "/api/folders/{folder_id}"
      additional_bindings {
        get: "/api/folders"
      }
    };
  }

  // PATCH or PUT /api/folders/{folder_id}  body: {"name": "..."}
  rpc RenameFolder(RenameFolderRequest) returns (FolderResponse) {
    option (google.api.http) = {
      patch: "/api/folders/{folder_id}"
      body: "*"
      additional_bindings {
        put: "/api/folders/{folder_id}"
        body: "*"
      }
    };
  }

  // PATCH or PUT /api/files/{file_id}  body: {"name": "..."}
  rpc RenameFile(RenameFileRequest) returns (FileResponse) {
    option (google.api.http) = {
      patch: "/api/files/{file_id}"
      body: "*"
      additional_bindings {
        put: "/api/files/{file_id}"
        body: "*"
      }
    };
  }

  // GET /api/files/quota - the caller's storage quota and current usage
  // (answered by asking users-service).
  rpc GetQuota(GetQuotaRequest) returns (StorageQuota) {
    option (google.api.http) = {
      get: "/api/files/quota"
    };
  }

  // POST /api/files/upload  (multipart/form-data: "file" + optional "folderId")
  //
  // Client-streaming: the first message carries the metadata, every following
  // message one chunk of the content. The upload is NOT bound with
  // google.api.http because grpc-gateway cannot parse multipart bodies; the
  // api-gateway serves this route by hand (api-gateway/upload.go) and streams
  // the received file into this rpc. Answered with HTTP 201 on success and
  // HTTP 413 when the quota is exceeded.
  rpc UploadFile(stream UploadFileRequest) returns (UploadFileResponse);

  // POST /api/files/{file_id}/version  (multipart/form-data: "file")
  //
  // Client-streaming: the first message carries the metadata (including the
  // target file_id), and every following message carries one chunk of the new
  // file content. Not bound with google.api.http because grpc-gateway cannot
  // parse multipart bodies; api-gateway serves this route by hand
  // (api-gateway/upload.go) and streams the received file into this rpc.
  // Answered with HTTP 200 on success, HTTP 404/403 if the file does not exist
  // or belongs to another user, HTTP 415/400 on file type mismatch, and
  // HTTP 413 when the additional quota required exceeds the user's limit.
  rpc UploadNewFileVersion(stream UploadNewFileVersionRequest) returns (UploadFileResponse);
}

// ---------- Domain messages ----------

message Folder {
  string id = 1;
  string name = 2;
  // Unset for top-level folders (JSON: key omitted).
  optional string parent_id = 3;
  string owner_id = 4;
  // JSON: RFC 3339 string, e.g. "2026-11-17T18:00:00Z".
  google.protobuf.Timestamp created_at = 5;
}

message BreadcrumbItem {
  string id = 1;
  string name = 2;
}

message FileItem {
  string id = 1;
  string name = 2;
  // Note: protojson encodes int64 as a JSON string ("123").
  int64 size_bytes = 3;
  string mime_type = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// The caller's quota, as kept by users-service.
// Note: protojson encodes int64 as a JSON string ("123").
message StorageQuota {
  int64 storage_quota_bytes = 1;
  int64 used_storage_bytes = 2;
  int64 remaining_bytes = 3;
}

// ---------- Requests ----------

message GetQuotaRequest {}

// One message of the UploadFile stream: the first one must be `metadata`,
// every later one a `chunk` of the file content.
message UploadFileRequest {
  oneof payload {
    UploadFileMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message UploadFileMetadata {
  string file_name = 1;
  // Target folder; unset / empty = root ("My Drive").
  optional string folder_id = 2;
  // Exact size of the content that follows. The quota is reserved for this
  // number BEFORE anything is stored, and the upload is rejected if the stream
  // delivers more or fewer bytes.
  int64 size_bytes = 3;
}

message CreateFolderRequest {
  string name = 1;
  // Unset / JSON null = create at root.
  optional string parent_id = 2;
}

message BrowseFolderRequest {
  // Bound from the URL path segment /api/folders/{folder_id}.
  string folder_id = 1;
  // Legacy query parameter: GET /api/folders?parentId=<id>.
  string parent_id = 2;
}

message RenameFolderRequest {
  // Bound from the URL path; `name` comes from the JSON body.
  string folder_id = 1;
  string name = 2;
}

message RenameFileRequest {
  // Bound from the URL path; `name` comes from the JSON body.
  string file_id = 1;
  string name = 2;
}

// ---------- Responses ----------

message FolderResponse {
  string message = 1;
  Folder folder = 2;
}

message FileResponse {
  string message = 1;
  FileItem file = 2;
}

message UploadFileResponse {
  string message = 1;
  FileItem file = 2;
  // Quota after this upload was accounted.
  StorageQuota quota = 3;
}

message FolderContentResponse {
  // null when browsing the root.
  Folder current_folder = 1;
  repeated BreadcrumbItem breadcrumbs = 2;
  repeated Folder folders = 3;
  repeated FileItem files = 4;
}


message UploadNewFileVersionRequest {
  oneof payload {
    UploadNewFileVersionMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message UploadNewFileVersionMetadata {
  string file_id = 1;
  string file_name = 2;
  int64 size_bytes = 3;
}
