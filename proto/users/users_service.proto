// IDL contract for the Users service.
//
// This file is the single source of truth for:
//   * the gRPC API that users-service implements (server stubs),
//   * the gRPC client the api-gateway uses to call it (client stubs),
//   * the REST <-> gRPC mapping the api-gateway exposes over HTTPS
//     (every rpc carries a google.api.http option = URI + HTTP method).
//
// After editing this file run `bash proto/generate.sh`.
// NEVER edit the generated *.pb.go / *_grpc.pb.go / *.pb.gw.go files.
//
// JSON naming: protojson converts snake_case field names to lowerCamelCase,
// e.g. `first_name` <-> "firstName", which is what the frontend sends/reads.
syntax = "proto3";

package users;

option go_package = "stashr/proto/users;userspb";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service UsersService {
  // POST /api/users/register -> 201 Created (signalled via x-http-code metadata)
  rpc Register(RegisterRequest) returns (MessageResponse) {
    option (google.api.http) = {
      post: "/api/users/register"
      body: "*"
    };
  }

  // GET /api/users/verify?token=...  (token is bound from the query string)
  rpc VerifyEmail(VerifyEmailRequest) returns (MessageResponse) {
    option (google.api.http) = {
      get: "/api/users/verify"
    };
  }

  // POST /api/users/login - first factor (password); sends an OTP by email.
  rpc Login(LoginRequest) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/api/users/login"
      body: "*"
    };
  }

  // POST /api/users/verify-otp - second factor; returns the session JWT.
  rpc VerifyOTP(VerifyOTPRequest) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/api/users/verify-otp"
      body: "*"
    };
  }

  // POST /api/users/resend-otp
  rpc ResendOTP(ResendOTPRequest) returns (MessageResponse) {
    option (google.api.http) = {
      post: "/api/users/resend-otp"
      body: "*"
    };
  }

  // POST /api/users/logout
  rpc Logout(LogoutRequest) returns (MessageResponse) {
    option (google.api.http) = {
      post: "/api/users/logout"
      body: "*"
    };
  }

  // POST /api/users/forgot-password
  rpc ForgotPassword(ForgotPasswordRequest) returns (MessageResponse) {
    option (google.api.http) = {
      post: "/api/users/forgot-password"
      body: "*"
    };
  }

  // GET /api/users/reset-password?token=...  (checks that a reset link is still usable)
  rpc ValidateResetToken(ValidateResetTokenRequest) returns (MessageResponse) {
    option (google.api.http) = {
      get: "/api/users/reset-password"
    };
  }

  // POST /api/users/reset-password
  rpc ResetPassword(ResetPasswordRequest) returns (MessageResponse) {
    option (google.api.http) = {
      post: "/api/users/reset-password"
      body: "*"
    };
  }

  // POST /api/users/change-expired-password
  // The restricted JWT travels in the HTTP "Authorization: Bearer ..." header,
  // which grpc-gateway forwards as gRPC metadata key "authorization".
  rpc ChangeExpiredPassword(ChangeExpiredPasswordRequest) returns (MessageResponse) {
    option (google.api.http) = {
      post: "/api/users/change-expired-password"
      body: "*"
    };
  }

  // POST /api/users/change-password - a signed-in user replaces their password.
  // Requires the session JWT, and the current password has to be supplied again.
  rpc ChangePassword(ChangePasswordRequest) returns (MessageResponse) {
    option (google.api.http) = {
      post: "/api/users/change-password"
      body: "*"
    };
  }

  // GET /api/config/limits - the limits set in config.yaml, so the frontend can
  // validate and label its inputs with the same values. Public: the
  // registration form needs them before anyone is signed in.
  rpc GetLimits(GetLimitsRequest) returns (LimitsResponse) {
    option (google.api.http) = {
      get: "/api/config/limits"
    };
  }

  // POST /api/users/magic-link-request
  rpc RequestMagicLink(MagicLinkRequest) returns (MessageResponse) {
    option (google.api.http) = {
      post: "/api/users/magic-link-request"
      body: "*"
    };
  }

  // POST /api/users/magic-link-login
  rpc MagicLinkLogin(MagicLinkLoginRequest) returns (AuthResponse) {
    option (google.api.http) = {
      post: "/api/users/magic-link-login"
      body: "*"
    };
  }

  // GET /api/admin/users - list all users with storage usage (admin only)
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (google.api.http) = {
      get: "/api/admin/users"
    };
  }

  // PATCH /api/admin/users/{user_id}/quota - update a user's storage quota (admin only)
  rpc UpdateUserQuota(UpdateUserQuotaRequest) returns (AdminUserInfo) {
    option (google.api.http) = {
      patch: "/api/admin/users/{user_id}/quota"
      body: "*"
    };
  }
}

// Requests of regular users for more storage, decided by an administrator.
service QuotaRequestService {
  // POST /api/users/quota-requests -> 201 Created (regular users only).
  // The requested quota must exceed the current one and stay within the
  // configured maximum. A user can have only one pending request (else 409).
  rpc CreateQuotaRequest(CreateQuotaRequestRequest) returns (QuotaRequestInfo) {
    option (google.api.http) = {
      post: "/api/users/quota-requests"
      body: "*"
    };
  }

  // GET /api/users/quota-requests - the caller's own requests, newest first.
  rpc ListMyQuotaRequests(ListMyQuotaRequestsRequest) returns (ListQuotaRequestsResponse) {
    option (google.api.http) = {
      get: "/api/users/quota-requests"
    };
  }

  // GET /api/admin/quota-requests[?status=pending|approved|rejected] (admin only).
  // Without a status every request is returned, newest first.
  rpc ListQuotaRequests(ListQuotaRequestsRequest) returns (ListQuotaRequestsResponse) {
    option (google.api.http) = {
      get: "/api/admin/quota-requests"
    };
  }

  // POST /api/admin/quota-requests/{request_id}/approve (admin only):
  // sets the user's quota to the requested size. 409 if the request is already
  // resolved or the user's quota is no longer below the requested size.
  rpc ApproveQuotaRequest(ResolveQuotaRequestRequest) returns (QuotaRequestInfo) {
    option (google.api.http) = {
      post: "/api/admin/quota-requests/{request_id}/approve"
      body: "*"
    };
  }

  // POST /api/admin/quota-requests/{request_id}/reject (admin only):
  // the user's quota stays as it is.
  rpc RejectQuotaRequest(ResolveQuotaRequestRequest) returns (QuotaRequestInfo) {
    option (google.api.http) = {
      post: "/api/admin/quota-requests/{request_id}/reject"
      body: "*"
    };
  }
}

// Internal service used by storage-service for the synchronous quota check
// that precedes every file upload (US-2.2).
//
// It deliberately has NO google.api.http options, so the api-gateway never
// exposes it over REST: it is reachable only over gRPC inside the Docker
// network. Every rpc still requires the caller's session JWT in the
// "authorization" metadata (storage-service forwards the one it received), and
// only ever touches the quota of the user that JWT belongs to.
service QuotaService {
  // Current quota / usage of the caller.
  rpc GetQuota(GetQuotaRequest) returns (QuotaResponse);

  // Atomically checks that the caller has `size_bytes` of free space and, if
  // so, reserves it (used += size_bytes). Check and reservation are one
  // database operation, so two concurrent uploads cannot both squeeze into the
  // last free bytes. A quota violation is NOT an error: it is a normal reply
  // with allowed = false and the current numbers.
  rpc ReserveQuota(ReserveQuotaRequest) returns (QuotaResponse);

  // Gives a reservation back (used -= size_bytes, never below 0), e.g. when
  // storing the file failed after the space was reserved.
  rpc ReleaseQuota(ReleaseQuotaRequest) returns (QuotaResponse);
}

// ---------- Requests ----------

message GetQuotaRequest {}

message ReserveQuotaRequest {
  int64 size_bytes = 1;
}

message ReleaseQuotaRequest {
  int64 size_bytes = 1;
}

message RegisterRequest {
  string first_name = 1;
  string last_name = 2;
  string email = 3;
  string password = 4;
  string confirm_password = 5;
}

message VerifyEmailRequest {
  string token = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message VerifyOTPRequest {
  string email = 1;
  string password = 2;
  string otp = 3;
}

message ResendOTPRequest {
  string email = 1;
  string password = 2;
}

message LogoutRequest {}

message ForgotPasswordRequest {
  string email = 1;
}

message ValidateResetTokenRequest {
  string token = 1;
}

message ResetPasswordRequest {
  string token = 1;
  string password = 2;
  string confirm_password = 3;
}

message ChangeExpiredPasswordRequest {
  string password = 1;
  string confirm_password = 2;
}

message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
  string confirm_password = 3;
}

message GetLimitsRequest {}

message CreateQuotaRequestRequest {
  int64 requested_quota_bytes = 1;
}

message ListMyQuotaRequestsRequest {}

message ListQuotaRequestsRequest {
  string status = 1;
}

message ResolveQuotaRequestRequest {
  string request_id = 1;
}

message MagicLinkRequest {
  string email = 1;
}

message MagicLinkLoginRequest {
  string token = 1;
}

message ListUsersRequest {}

message UpdateUserQuotaRequest {
  string user_id = 1;
  int64 storage_quota_bytes = 2;
}

// ---------- Responses ----------

// Generic reply carrying only a human-readable message.
message MessageResponse {
  string message = 1;
}

message UserInfo {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string role = 5;
}

message AdminUserInfo {
  string id = 1;
  string email = 2;
  string first_name = 3;
  string last_name = 4;
  string role = 5;
  bool is_verified = 6;
  int64 storage_quota_bytes = 7;
  int64 used_storage_bytes = 8;
}

message ListUsersResponse {
  repeated AdminUserInfo users = 1;
}

// The config.yaml limits the frontend mirrors.
message LimitsResponse {
  int64 min_quota_bytes = 1;
  int64 max_quota_bytes = 2;
  int64 default_quota_bytes = 3;
  int32 password_min_length = 4;
}

message QuotaRequestInfo {
  string id = 1;
  string user_id = 2;
  string email = 3;
  string first_name = 4;
  string last_name = 5;
  // The user's quota and usage right now.
  int64 current_quota_bytes = 6;
  int64 used_storage_bytes = 7;
  // The user's quota at the time the request was made.
  int64 quota_at_request_bytes = 8;
  int64 requested_quota_bytes = 9;
  // "pending", "approved" or "rejected".
  string status = 10;
  google.protobuf.Timestamp created_at = 11;
  // Unset while the request is pending.
  google.protobuf.Timestamp resolved_at = 12;
}

message ListQuotaRequestsResponse {
  repeated QuotaRequestInfo requests = 1;
}

// Reply of every QuotaService rpc.
message QuotaResponse {
  // Only meaningful for ReserveQuota: false = not enough free space, nothing reserved.
  bool allowed = 1;
  int64 storage_quota_bytes = 2;
  int64 used_storage_bytes = 3;
  int64 remaining_bytes = 4;
}

// Reply of every login-like rpc (Login, VerifyOTP, MagicLinkLogin).
//   * Login step 1:        message only.
//   * Successful login:    message + token + user.
//   * Expired-ban login:   message + restricted token + restricted=true.
message AuthResponse {
  string message = 1;
  string token = 2;
  bool restricted = 3;
  UserInfo user = 4;
}
