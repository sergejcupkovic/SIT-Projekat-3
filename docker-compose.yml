name: Stashr
services:
  mongodb:
    image: mongo:7.0
    container_name: users_mongodb
    command: ["mongod", "--port", "${MONGO_PORT}"]
    ports:
      - "${MONGO_PORT}:${MONGO_PORT}"
    volumes:
      - mongo_data:/data/db

  mailpit:
    image: axllent/mailpit:v1.15
    container_name: mailpit
    environment:
      MP_SMTP_BIND_ADDR: 0.0.0.0:${SMTP_PORT}
      MP_UI_BIND_ADDR: 0.0.0.0:${MAILPIT_UI_PORT}
    ports:
      - "${MAILPIT_UI_PORT}:${MAILPIT_UI_PORT}"
      - "${SMTP_PORT}:${SMTP_PORT}"

  minio:
    image: chrislusf/seaweedfs:latest
    container_name: stashr_minio
    command:
      [
        "server",
        "-dir=/data",
        "-s3",
        "-s3.port=9000",
        "-s3.config=/etc/seaweedfs/s3.json",
      ]
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:8888"
    volumes:
      - minio_data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro
  users-service:
    build: ./users-service
    container_name: users_service
    ports:
      - "${USERS_SERVICE_PORT}:${USERS_SERVICE_PORT}"
    env_file: .env
    environment:
      CONFIG_PATH: /app/config.yaml
      MONGO_URI: mongodb://mongodb:${MONGO_PORT}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - mongodb
      - mailpit

  storage-service:
    build: ./storage-service
    container_name: storage_service
    restart: on-failure
    ports:
      - "${STORAGE_SERVICE_PORT:-8082}:${STORAGE_SERVICE_PORT:-8082}"
    env_file: .env
    environment:
      PORT: ${STORAGE_SERVICE_PORT:-8082}
      MONGO_URI: mongodb://mongodb:${MONGO_PORT}
      MONGO_DB_NAME: storage_db
      USERS_SERVICE_URL: http://users-service:${USERS_SERVICE_PORT}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_BUCKET: ${MINIO_BUCKET:-stashr-files}
      MINIO_USE_SSL: "false"
    depends_on:
      - mongodb
      - minio
      - users-service

  api-gateway:
    build: ./api-gateway
    container_name: api_gateway
    ports:
      - "${GATEWAY_PORT}:${GATEWAY_PORT}"
    env_file: .env
    environment:
      USERS_SERVICE_URL: http://users-service:${USERS_SERVICE_PORT}
      STORAGE_SERVICE_URL: http://storage-service:${STORAGE_SERVICE_PORT:-8082}
    depends_on:
      - users-service
      - storage-service

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - api-gateway

volumes:
  mongo_data:
  minio_data:
